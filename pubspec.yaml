name: kanji_remake
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_auth: ^5.5.4
  firebase_core: ^3.13.1
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  intl: ^0.19.0
  objectbox: ^4.2.0
  objectbox_flutter_libs: ^4.2.0
  path: ^1.8.0
  path_provider: ^2.0.2
  percent_indicator: ^4.0.0
  shared_preferences: ^2.0.6
  shared_preferences_web: ^2.0.1
  go_router: ^15.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.0.6
  change_app_package_name: ^1.0.0
  riverpod_generator: ^2.6.1
  riverpod_lint: ^2.6.3

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/databases/

flutter_intl:
  enabled: true
