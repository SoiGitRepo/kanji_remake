plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdkVersion 35
    buildToolsVersion "34.0.0"

    namespace 'com.soigrames.kanjiremake'

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.soigrames.kanjiremake"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        kanjiremake {
            storeFile file('kanjiremake.keystore')
            storePassword 'liangsiqiao'
            keyAlias 'kanjiremake'
            keyPassword 'liangsiqiao'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.kanjiremake
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.kanjiremake
            minifyEnabled false
            shrinkResources false
        }
        profile {
            // Flutter 的 Profile 构建类型
            signingConfig signingConfigs.kanjiremake
            matchingFallbacks = ['release']
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:28.3.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

